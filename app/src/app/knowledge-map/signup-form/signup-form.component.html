@if (isDone) {
  <div class="signup-done" role="status">
    <mat-icon class="signup-done__icon">check_circle</mat-icon>
    <span>You're on the list. We'll email you when sign-in is ready.</span>
  </div>
} @else {
  @if (errorMessage) {
    <app-alert-banner [message]="errorMessage" (dismissed)="onDismissError()"></app-alert-banner>
  }

  <form class="signup-form" [formGroup]="form" (ngSubmit)="onSubmit()">
    <mat-form-field appearance="outline" class="signup-form__field">
      <mat-label>Email</mat-label>
      <input matInput type="email" formControlName="email" autocomplete="email">
      @if (form.controls['email'].invalid) {
        <mat-error>Enter a valid email address.</mat-error>
      }
    </mat-form-field>
    <mat-form-field appearance="outline" class="signup-form__field">
      <mat-label>What do you want to learn?</mat-label>
      <input matInput type="text" formControlName="goal" maxlength="120" autocomplete="off">
    </mat-form-field>
    <button mat-flat-button type="submit" class="signup-form__button" [disabled]="form.invalid || isSubmitting">
      @if (isSubmitting) {
        <mat-spinner diameter="20"></mat-spinner>
      } @else {
        <span>Get early access</span>
      }
    </button>
  </form>
}
